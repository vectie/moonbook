name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  native:
    concurrency:
      group: moonbook-ci-${{ github.ref }}-${{ matrix.channel }}
      cancel-in-progress: true
    name: Native (${{ matrix.channel }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.channel == 'nightly' }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: _workspace/moonbook
    strategy:
      fail-fast: false
      matrix:
        channel: [latest, nightly]
    steps:
      - uses: actions/checkout@v5
        with:
          path: _workspace/moonbook
      - name: Check out exact MoonLib source dependency
        uses: actions/checkout@v5
        with:
          repository: vectie/moonlib
          ref: 410ae0da4cdaf2de5da22da59c682f8619c1355b
          path: _workspace/moonlib
      - name: Check out exact MoonLeaf source dependency
        uses: actions/checkout@v5
        with:
          repository: vectie/moonleaf
          ref: 58c4554b2b62e20ac8b7cc0e8e99499260851272
          path: _workspace/moonleaf
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s "${{ matrix.channel }}"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Inspect toolchain
        run: moon version --all
      - name: Initialize dependency registry
        run: moon update
      - name: Check formatting
        if: matrix.channel == 'latest'
        run: moon fmt --check
      - name: Check native packages
        run: moon check --target native --warn-list +73
      - name: Test native packages
        run: moon test --target native --warn-list +73
      - name: Verify generated interfaces
        if: matrix.channel == 'nightly'
        run: |
          moon info --target native
          git diff --exit-code -- '*.mbti'
